<svg xmlns="http://www.w3.org/2000/svg" width="480" height="160" viewBox="0 0 480 160" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sonoran desert landscape at sunset">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d2f66"/>
      <stop offset="0.4" stop-color="#8a5170"/>
      <stop offset="0.72" stop-color="#d6824e"/>
      <stop offset="1" stop-color="#f0ad5f"/>
    </linearGradient>
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4a52"/>
      <stop offset="1" stop-color="#4a2c38"/>
    </linearGradient>
  </defs>
  <rect width="480" height="160" fill="url(#sky)"/>
  <circle cx="358" cy="94" r="32" fill="#ffd27a" opacity="0.92"/>
  <circle cx="358" cy="94" r="32" fill="none" stroke="#fff0cf" stroke-width="1" opacity="0.4"/>
  <!-- distant mountain ridge -->
  <path d="M0 118 L70 92 L140 110 L210 80 L300 108 L370 78 L440 104 L480 92 L480 160 L0 160 Z" fill="url(#mtn)"/>
  <path d="M0 132 L90 112 L180 128 L280 104 L360 126 L440 110 L480 122 L480 160 L0 160 Z" fill="#3a2330"/>
  <!-- foreground desert floor -->
  <rect y="138" width="480" height="22" fill="#26161f"/>
  <!-- saguaro cacti (right-biased) -->
  <g fill="#1c2a24">
    <g transform="translate(300,96)">
      <rect x="-6" y="0" width="12" height="52" rx="6"/>
      <rect x="-20" y="16" width="10" height="20" rx="5"/><rect x="-20" y="16" width="10" height="8" rx="4"/>
      <rect x="10" y="10" width="10" height="26" rx="5"/><rect x="10" y="10" width="10" height="8" rx="4"/>
    </g>
    <g transform="translate(414,84)">
      <rect x="-8" y="0" width="16" height="66" rx="8"/>
      <rect x="-26" y="20" width="12" height="26" rx="6"/><rect x="-26" y="20" width="12" height="10" rx="5"/>
      <rect x="14" y="12" width="12" height="34" rx="6"/><rect x="14" y="12" width="12" height="10" rx="5"/>
    </g>
    <g transform="translate(150,110)">
      <rect x="-5" y="0" width="10" height="40" rx="5"/>
      <rect x="9" y="8" width="8" height="18" rx="4"/><rect x="9" y="8" width="8" height="6" rx="3"/>
    </g>
