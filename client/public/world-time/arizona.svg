<svg xmlns="http://www.w3.org/2000/svg" width="480" height="160" viewBox="0 0 480 160" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sonoran desert landscape">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a4d"/>
      <stop offset="0.45" stop-color="#7a4a44"/>
      <stop offset="0.8" stop-color="#b9713f"/>
      <stop offset="1" stop-color="#d98a48"/>
    </linearGradient>
  </defs>
  <rect width="480" height="160" fill="url(#sky)"/>
  <circle cx="360" cy="96" r="30" fill="#f2b25c" opacity="0.85"/>
  <!-- distant mountain ridge -->
