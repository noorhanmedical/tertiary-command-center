<svg xmlns="http://www.w3.org/2000/svg" width="480" height="160" viewBox="0 0 480 160" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Burj Khalifa dominating the Dubai skyline">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1430"/>
      <stop offset="0.55" stop-color="#213a63"/>
      <stop offset="1" stop-color="#c98a55"/>
    </linearGradient>
  </defs>
  <rect width="480" height="160" fill="url(#sky)"/>
  <!-- lower skyline -->
  <g fill="#0a1526">
    <rect x="120" y="118" width="22" height="42"/>
    <rect x="148" y="106" width="18" height="54"/>
    <rect x="238" y="112" width="20" height="48"/>
    <rect x="264" y="100" width="18" height="60"/>
    <rect x="404" y="108" width="22" height="52"/>
    <rect x="432" y="118" width="26" height="42"/>
  </g>
  <!-- Burj Khalifa: tapered tiered spire, right-of-center -->
  <g fill="#0b1626">
    <path d="M352 160 L352 60 L358 60 L360 40 L362 60 L368 60 L368 160 Z"/>
    <path d="M360 40 L360 8 L361 8 L361 40 Z"/>
    <rect x="344" y="96" width="8" height="64"/>
    <rect x="368" y="96" width="8" height="64"/>
    <rect x="336" y="120" width="8" height="40"/>
    <rect x="376" y="120" width="8" height="40"/>
  </g>
  <g fill="#5b8cff" opacity="0.55">
    <rect x="358" y="70" width="4" height="7"/><rect x="358" y="88" width="4" height="7"/>
    <rect x="358" y="106" width="4" height="7"/><rect x="358" y="124" width="4" height="7"/>
    <rect x="346" y="110" width="3" height="5"/><rect x="371" y="110" width="3" height="5"/>
  </g>
</svg>
