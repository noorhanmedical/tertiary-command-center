<svg xmlns="http://www.w3.org/2000/svg" width="480" height="160" viewBox="0 0 480 160" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Manila bayfront skyline at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1c40"/>
      <stop offset="0.5" stop-color="#5b3a5a"/>
      <stop offset="1" stop-color="#b56a4e"/>
    </linearGradient>
  </defs>
  <rect width="480" height="160" fill="url(#sky)"/>
  <circle cx="120" cy="70" r="26" fill="#e8a15a" opacity="0.7"/>
  <!-- palm silhouettes left -->
  <g fill="#160f1e">
    <path d="M60 160 v-56 c-2 -6 4 -10 4 -10 M64 94 c-14 -2 -22 4 -26 10 M64 94 c14 -2 22 4 26 10 M64 94 c-6 -12 0 -20 6 -24 M64 94 c8 -10 4 -20 -2 -24"/>
    <rect x="61" y="98" width="6" height="62"/>
  </g>
  <!-- skyline right-biased -->
  <g fill="#140d1c">
    <rect x="230" y="100" width="20" height="60"/>
    <rect x="256" y="84" width="22" height="76"/>
    <rect x="284" y="96" width="18" height="64"/>
    <rect x="308" y="72" width="24" height="88"/>
    <path d="M338 66 l12 -12 l12 12 v94 h-24 Z"/>
    <rect x="368" y="80" width="22" height="80"/>
    <rect x="396" y="92" width="20" height="68"/>
    <rect x="420" y="104" width="22" height="56"/>
    <rect x="444" y="114" width="20" height="46"/>
  </g>
  <!-- bay water -->
  <rect y="140" width="480" height="20" fill="#241528"/>
  <g fill="#e8a15a" opacity="0.4"><rect x="120" y="144" width="10" height="3"/><rect x="118" y="150" width="14" height="2"/></g>
  <g fill="#5b8cff" opacity="0.5">
    <rect x="344" y="76" width="3" height="6"/><rect x="316" y="88" width="3" height="5"/><rect x="374" y="94" width="3" height="5"/>
  </g>
</svg>
