# Local development — spins up a Postgres instance only.
# The app itself runs via `npm run dev` (hot-reload via Vite).
#
# Usage:
#   docker compose up -d        # start Postgres in background
#   docker compose down         # stop and remove containers
#   docker compose down -v      # also wipe the database volume (full reset)

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: plexus
      POSTGRES_PASSWORD: plexusdev
      POSTGRES_DB: plexus
    ports:
      - "5432:5432"
    volumes:
      - plexus_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plexus -d plexus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  plexus_db_data:
